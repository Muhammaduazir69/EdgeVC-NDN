[General]
network = simulations.campus.HospitalCampus
sim-time-limit = 600s
warmup-period = 20s
repeat = 10
seed-set = ${repetition}
cmdenv-express-mode = true
cmdenv-status-frequency = 60s
**.scalar-recording = true
**.vector-recording = false
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec

*.simManager.warmup = 20s
*.simManager.costModelFile = "cost_model.txt"
*.simManager.costReportFile = "results/cost_model_report.csv"
*.simManager.outputPrefix = "results/" + "${configname}-${runnumber}"
*.simManager.scenarioName = "campus"

*.producer.fhirCorpusDir = "../../fhir_corpus/extracted/sample-bulk-fhir-datasets-10-patients"
*.consumer[*].requestRate = 4Hz
*.consumer[*].zipfAlpha = 0.8
*.consumer[*].catalogSize = 10000
*.backbone.csSize = 1000
*.dcRouter.csSize = 1000
*.core[*].csSize = 500
*.edge[*].csSize = 300
*.issuer.suspensionRate = 0.005
*.issuer.revocationRate = 0.002

# ---------------------------------------------------------------- smoke
[Config Smoke]
sim-time-limit = 120s
repeat = 1
**.framework = ${fw="none","didvc","abac","scbac","didvc_producer"}
*.simManager.label = ${fw}
*.simManager.detailedLogs = true

# ======================================================================
# Paper A experiments. Every configuration changes exactly one factor
# against the [General] baseline; framework variants iterate in lockstep.
# ======================================================================

# E1: framework comparison at the baseline operating point.
[Config Main]
*.simManager.label = ${variant="DIDVC","DIDVC-full","DIDVC-producer","DIDVC-key","ABAC","ABAC-cache","ABAC-cache-push","SCBAC","SCBAC-cache","SCBAC-cache-push","NDN","ABAC-par","ABAC-cache-push-par"}
**.framework = ${fw="didvc","didvc","didvc_producer","didvc_key","abac","abac","abac","scbac","scbac","scbac","none","abac","abac" ! variant}
**.compactPresentation = ${cp=true,false,true,true,true,true,true,true,true,true,true,true,true ! variant}
**.decisionCacheTtl = ${ttl=0,0,0,0,0,30,30,0,30,30,0,0,30 ! variant}s
*.issuer.pushInvalidation = ${push=false,false,false,false,false,false,true,false,false,true,false,false,true ! variant}
# "-par": the PEP fetches the record upstream while the remote decision is pending.
**.speculativeFetch = ${sf=false,false,false,false,false,false,false,false,false,false,false,true,true ! variant}

# E2: distance between the campus and the data center (authority, PDP).
[Config Distance]
repeat = 5
*.simManager.label = ${variant="DIDVC","ABAC","ABAC-cache","SCBAC","ABAC-cache-push"}
**.framework = ${fw="didvc","abac","abac","scbac","abac" ! variant}
**.decisionCacheTtl = ${ttl=0,0,30,0,30 ! variant}s
*.issuer.pushInvalidation = ${push=false,false,false,false,true ! variant}
# dc = 0: the data center (PDP, producer) sits next to the campus backbone.
*.dcDelay = ${dc=0,1,5,10,20,40}ms

# E3: number of clinicians (offered load scales with it).
[Config Scale]
repeat = 5
*.simManager.label = ${variant="DIDVC","DIDVC-full","ABAC","ABAC-cache","SCBAC"}
**.framework = ${fw="didvc","didvc","abac","abac","scbac" ! variant}
**.compactPresentation = ${cp=true,false,true,true,true ! variant}
**.decisionCacheTtl = ${ttl=0,0,0,30,0 ! variant}s
*.numConsumers = ${n=15,30,60,120}

# E4a: edge cache capacity.
[Config CacheSize]
repeat = 5
*.simManager.label = ${variant="DIDVC","ABAC","SCBAC","NDN"}
**.framework = ${fw="didvc","abac","scbac","none" ! variant}
*.edge[*].csSize = ${cs=0,50,150,300,1000}

# E4b: content popularity skew.
[Config Popularity]
repeat = 5
*.simManager.label = ${variant="DIDVC","ABAC","SCBAC","NDN"}
**.framework = ${fw="didvc","abac","scbac","none" ! variant}
*.consumer[*].zipfAlpha = ${alpha=0.6,0.8,1.0,1.2}

# E5: revocation and suspension dynamics (higher event rates).
[Config Revocation]
**.stopOnRevocation = false   # revoked holders act as persistent insiders
*.issuer.revocationRate = 0.02
*.issuer.suspensionRate = 0.05
*.issuer.reactivationDelay = 60s
*.simManager.detailedLogs = true
*.simManager.label = ${variant="DIDVC-push","DIDVC-pull10","DIDVC-pull60","DIDVC-producer","DIDVC-key","ABAC","ABAC-cache","ABAC-cache-push","SCBAC","SCBAC-cache","SCBAC-cache-push"}
**.framework = ${fw="didvc","didvc","didvc","didvc_producer","didvc_key","abac","abac","abac","scbac","scbac","scbac" ! variant}
**.statusDissemination = ${sd="push","pull","pull","push","push","push","push","push","push","push","push" ! variant}
**.pullInterval = ${pi=10,10,60,10,10,10,10,10,10,10,10 ! variant}s
**.decisionCacheTtl = ${ttl=0,0,0,0,0,0,30,30,0,30,30 ! variant}s
*.issuer.pushInvalidation = ${push=false,false,false,false,false,false,false,true,false,false,true ! variant}

# E6: lossy links (status dissemination robustness under loss).
[Config Loss]
**.stopOnRevocation = false   # revoked holders act as persistent insiders
repeat = 5
*.issuer.revocationRate = 0.02
*.issuer.suspensionRate = 0.05
*.simManager.label = ${variant="DIDVC","DIDVC-nobeacon","ABAC","SCBAC"}
**.framework = ${fw="didvc","didvc","abac","scbac" ! variant}
**.statusBeacon = ${sb=1,0,1,1 ! variant}s
*.linkPer = ${per=0,0.001,0.01,0.05}

# E7: failure of the authorization service between 200 s and 400 s.
[Config Failure]
*.simManager.detailedLogs = true
*.simManager.label = ${variant="DIDVC-issuerDown","ABAC-pdpDown","ABAC-cache-pdpDown","SCBAC-1down","SCBAC-2down","ABAC-cachepush300-pdpDown"}
**.framework = ${fw="didvc","abac","abac","scbac","scbac","abac" ! variant}
**.decisionCacheTtl = ${ttl=0,0,30,0,0,300 ! variant}s
*.issuer.pushInvalidation = ${push=false,false,false,false,false,true ! variant}
*.issuer.failAt = ${isf=200,-1,-1,-1,-1,-1 ! variant}s
*.issuer.recoverAt = 400s
*.pdp.failAt = ${pf=-1,200,200,-1,-1,200 ! variant}s
*.pdp.recoverAt = 400s
*.validator[1].failAt = ${v1=-1,-1,-1,200,200,-1 ! variant}s
*.validator[1].recoverAt = 400s
*.validator[2].failAt = ${v2=-1,-1,-1,-1,200,-1 ! variant}s
*.validator[2].recoverAt = 400s

# E8: edge hardware (CPU slow-down factor of the edge routers) at high load.
[Config EdgeCpu]
repeat = 5
*.numConsumers = 60
*.consumer[*].requestRate = 8Hz
*.simManager.label = ${variant="DIDVC","DIDVC-full","ABAC"}
**.framework = ${fw="didvc","didvc","abac" ! variant}
**.compactPresentation = ${cp=true,false,true ! variant}
*.edge[*].cpuFactor = ${cpu=1,4,16,32}

# E9: decision-cache TTL with and without pushed invalidation (trade-off
# between latency and exposure), at the elevated revocation rates of E5.
[Config CacheTradeoff]
**.stopOnRevocation = false   # revoked holders act as persistent insiders
repeat = 10
*.issuer.revocationRate = 0.02
*.issuer.suspensionRate = 0.05
*.issuer.reactivationDelay = 60s
*.simManager.label = ${variant="ABAC-cache","ABAC-cache-push","DIDVC-push"}
**.framework = ${fw="abac","abac","didvc" ! variant}
*.issuer.pushInvalidation = ${push=false,true,false ! variant}
**.decisionCacheTtl = ${ttl=1,5,30,300,3600}s
# EdgeVC has no decision cache: one paired arm (same seeds) instead of five.
constraint = ($variant) != "DIDVC-push" || ($ttl) == 30

# E10a: sensitivity to the cryptographic costs (all nodes scaled together).
[Config CostCrypto]
repeat = 5
*.simManager.label = ${variant="DIDVC","ABAC","SCBAC"}
**.framework = ${fw="didvc","abac","scbac" ! variant}
**.cpuFactor = ${cf=0.5,1,2}

# E10b: sensitivity to the per-packet forwarding cost.
[Config CostForwarding]
repeat = 5
*.simManager.label = ${variant="DIDVC","ABAC","SCBAC"}
**.framework = ${fw="didvc","abac","scbac" ! variant}
**.forwardingDelay = ${fd=10,50,200}us

# E11: the edge's safety mechanisms in action. "failclosed": the issuer fails
# at 200 s and the staleness bound is shortened to 120 s so that edges must
# fail closed within the run; "sessions2": a two-entry session table forces
# evictions, presentation-required NACKs and full re-presentations.
[Config Guards]
repeat = 5
*.simManager.detailedLogs = true
*.simManager.label = ${variant="DIDVC-failclosed","DIDVC-sessions2"}
**.framework = "didvc"
*.issuer.failAt = ${isf=200,-1 ! variant}s
*.issuer.recoverAt = 400s
**.statusMaxAge = ${sma=120,300 ! variant}s
**.sessionCapacity = ${sc=1024,2 ! variant}
