[General]
network = simulations.nr5g.HospitalNr
image-path = ../../../simu5G/images
sim-time-limit = 300s
warmup-period = 20s
repeat = 10
seed-set = ${repetition}
cmdenv-express-mode = true
cmdenv-status-frequency = 60s

cmdenv-log-prefix = ""
**.routingRecorder.enabled = false
**.vector-recording = false
*.simManager.scalar-recording = true
*.gnb.cellularNic.**.scalar-recording = true
*.mecHost.app[0].**.scalar-recording = true
**.scalar-recording = false
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec

*.simManager.warmup = 20s
*.simManager.costModelFile = "../campus/cost_model.txt"
*.simManager.outputPrefix = "results/" + "${configname}-${runnumber}"
*.simManager.scenarioName = "nr5g"

############### radio (3GPP NR, single SA cell) ###############
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 500m
**.numBands = 50
**.ueTxPower = 26
**.eNodeBTxPower = 40
**.targetBler = 0.01
**.blerShift = 5
*.gnb.cellularNic.mac.schedulingDisciplineDl = "PF"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "PF"
*.ue*[*].macCellId = 0
*.ue*[*].masterId = 0
*.ue*[*].nrMacCellId = 1
*.ue*[*].nrMasterId = 1
*.ue*[*].mobility.typename = "StationaryMobility"
*.ue*[*].mobility.initialX = uniform(250m, 750m)
*.ue*[*].mobility.initialY = uniform(250m, 750m)

############### NDN applications ###############
# Data center: producer (9001), issuer (9002), PDP (9003), validator 0 (9004)
*.dcHost.numApps = 4
*.dcHost.app[*].typename = "ned.NdnApp"
*.dcHost.app[*].remotes = "mecHost:9000"
*.dcHost.app[0].nodeType = "Producer"
*.dcHost.app[0].localPort = 9001
*.dcHost.app[1].nodeType = "Issuer"
*.dcHost.app[1].localPort = 9002
*.dcHost.app[2].nodeType = "AuthzServer"
*.dcHost.app[2].localPort = 9003
*.dcHost.app[2].node.mode = "pdp"
*.dcHost.app[3].nodeType = "AuthzServer"
*.dcHost.app[3].localPort = 9004
*.dcHost.app[3].node.mode = "validator"
*.siteHost[*].numApps = 1
*.siteHost[*].app[0].typename = "ned.NdnApp"
*.siteHost[*].app[0].nodeType = "AuthzServer"
*.siteHost[*].app[0].localPort = 9005
*.siteHost[*].app[0].remotes = "mecHost:9000"
*.siteHost[*].app[0].node.mode = "validator"

# MEC edge router: faces 0..6 static (producer, issuer, pdp, validators),
# faces 7.. bound to clinician UEs on first contact.
*.mecHost.numApps = 1
*.mecHost.app[0].typename = "ned.NdnApp"
*.mecHost.app[0].nodeType = "Router"
*.mecHost.app[0].localPort = 9000
*.mecHost.app[0].numFaces = 137
*.mecHost.app[0].remotes = "dcHost:9001 dcHost:9002 dcHost:9003 dcHost:9004 siteHost[0]:9005 siteHost[1]:9005 siteHost[2]:9005"
*.mecHost.app[0].node.consumerFaceStart = 7
*.mecHost.app[0].node.upstreamFaces = "0"
*.mecHost.app[0].node.ctrlRoutes = "^.^.^.dcHost.app[1].node=1,^.^.^.dcHost.app[2].node=2,^.^.^.dcHost.app[3].node=3,^.^.^.siteHost[0].app[0].node=4,^.^.^.siteHost[1].app[0].node=5,^.^.^.siteHost[2].app[0].node=6"
*.mecHost.app[0].node.csSize = 300

**.node.issuerModulePath = "^.^.^.dcHost.app[1].node"
**.node.producerModulePath = "^.^.^.dcHost.app[0].node"
*.dcHost.app[0].node.fhirCorpusDir = "../../fhir_corpus/extracted/sample-bulk-fhir-datasets-10-patients"
*.dcHost.app[1].node.suspensionRate = 0.005
*.dcHost.app[1].node.revocationRate = 0.002

# Clinician UEs
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "ned.NdnApp"
*.ue[*].app[0].nodeType = "Consumer"
*.ue[*].app[0].localPort = 9010
*.ue[*].app[0].remotes = "mecHost:9000"
*.ue[*].app[0].node.requestRate = 2Hz
*.ue[*].app[0].node.zipfAlpha = 0.8
*.ue[*].app[0].node.catalogSize = 10000
*.ue[*].app[0].node.userRole = choose(ancestorIndex(2) % 15, "Attending Resident Nurse Attending Nurse Radiologist LabTechnician Pharmacist Nurse Attending Nurse Surgeon Anesthesiologist Receptionist Administrator")
*.ue[*].app[0].node.unit = choose(ancestorIndex(2) % 15, "ICU ICU ICU Emergency Emergency Radiology Radiology Pharmacy Surgery Oncology Oncology Surgery Surgery Reception Administration")
*.ue[*].app[0].node.clearance = int(choose(ancestorIndex(2) % 15, "4 3 3 4 3 3 2 3 3 4 3 4 4 1 1"))

# Adversary UEs
*.ueAtk[*].numApps = 1
*.ueAtk[*].app[0].typename = "ned.NdnApp"
*.ueAtk[*].app[0].nodeType = "Consumer"
*.ueAtk[*].app[0].localPort = 9010
*.ueAtk[*].app[0].remotes = "mecHost:9000"
*.ueAtk[*].app[0].node.userRole = "Receptionist"
*.ueAtk[*].app[0].node.unit = "Reception"
*.ueAtk[*].app[0].node.clearance = 1
*.ueAtk[*].app[0].node.attackVictim = "^.^.^.ue[0].app[0].node"
*.ueAtk[*].app[0].node.attackRate = 2Hz

[Config Smoke5g]
sim-time-limit = 60s
repeat = 1
**.framework = ${fw="didvc","abac","scbac","none"}
*.simManager.label = ${fw}
*.simManager.detailedLogs = true

# ======================================================================
# Paper B experiments (5G NR, edge server at the UPF N6 interface).
# ======================================================================

# B1: framework comparison as the number of clinician UEs grows.
[Config NrScale]
repeat = 5
*.simManager.label = ${variant="DIDVC","ABAC","ABAC-cache","ABAC-cache-push","SCBAC","NDN","ABAC-par"}
**.framework = ${fw="didvc","abac","abac","abac","scbac","none","abac" ! variant}
**.decisionCacheTtl = ${ttl=0,0,30,30,0,0,0 ! variant}s
*.dcHost.app[1].node.pushInvalidation = ${push=false,false,false,true,false,false,false ! variant}
**.speculativeFetch = ${sf=false,false,false,false,false,false,true ! variant}
*.numUe = ${nue=10,20,40,60}

# B2: adversary suite, one adversary UE per attack class.
[Config NrAttack]
*.numUe = 20
*.numAttackers = 6
*.ueAtk[*].app[0].node.attackType = choose(ancestorIndex(2), "replay forged_vc stolen_vc did_spoof tampered_vc no_credential")
*.simManager.detailedLogs = true
# "NDN": the same adversaries against no access control, to show the suite is live.
*.simManager.label = ${variant="DIDVC","ABAC","SCBAC","NDN"}
**.framework = ${fw="didvc","abac","scbac","none" ! variant}

# B3: break-glass (emergency) requests under each design.
[Config NrBreakGlass]
*.numUe = 40
*.ue[*].app[0].node.breakGlassRate = 0.05
*.simManager.label = ${variant="DIDVC","ABAC","SCBAC"}
**.framework = ${fw="didvc","abac","scbac" ! variant}

# B4: revocation burst: five clinicians revoked between 100 s and 110 s.
[Config NrRevocationBurst]
**.stopOnRevocation = false   # revoked holders act as persistent insiders
*.numUe = 30
*.dcHost.app[1].node.revocationRate = 0
*.dcHost.app[1].node.suspensionRate = 0
*.dcHost.app[1].node.revocationTimes = "100,102.5,105,107.5,110"
*.simManager.detailedLogs = true
*.simManager.label = ${variant="DIDVC","ABAC","ABAC-cache","ABAC-cache-push","SCBAC"}
**.framework = ${fw="didvc","abac","abac","abac","scbac" ! variant}
**.decisionCacheTtl = ${ttl=0,0,30,30,0 ! variant}s
*.dcHost.app[1].node.pushInvalidation = ${push=false,false,false,true,false ! variant}

# B5: clinician device class (CPU slow-down factor of the UE).
[Config NrDevice]
*.numUe = 20
*.ue[*].app[0].node.cpuFactor = ${dev=1,4,10}
*.simManager.label = ${variant="DIDVC","ABAC"}
**.framework = ${fw="didvc","abac" ! variant}

# B6: distance to the data center (PDP, producer), with a PEP that fetches the
# record while the decision is pending (ABAC-par).
[Config NrDistance]
repeat = 5
*.numUe = 30
*.simManager.label = ${variant="DIDVC","ABAC","ABAC-par","ABAC-cache-push","SCBAC"}
**.framework = ${fw="didvc","abac","abac","abac","scbac" ! variant}
**.decisionCacheTtl = ${ttl=0,0,0,30,0 ! variant}s
*.dcHost.app[1].node.pushInvalidation = ${push=false,false,false,true,false ! variant}
**.speculativeFetch = ${sf=false,false,true,false,false ! variant}
*.dcDelay = ${dc=0.5,1,2,5}ms

# B7: latency attribution. Plain NDN padded to the size of signed Interests
# (+212 B) and protected Data (+289 B) isolates the radio cost of larger packets.
[Config NrPad]
repeat = 5
*.numUe = 60
*.simManager.label = ${variant="NDN","NDN-padded","DIDVC"}
**.framework = ${fw="none","none","didvc" ! variant}
**.extraInterestBytes = ${xi=0,212,0 ! variant}
**.extraDataBytes = ${xd=0,289,0 ! variant}
